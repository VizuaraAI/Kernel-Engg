<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My First LLM</title>
<style>
  :root { --bg:#15121d; --card:#1f1a2b; --line:#332c44; --txt:#f7f3ec; --soft:#bdb6cb; --muted:#8a8398;
          --amber:#fbb03b; --cyan:#29abe2; --mag:#ff4fd8; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt); font:16px/1.55 -apple-system, "Helvetica Neue", Arial, sans-serif;
         min-height:100vh; display:flex; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:820px; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:26px; font-weight:700; }
  .sub { color:var(--soft); font-size:14px; margin-top:2px; }
  .row { display:flex; gap:10px; }
  #url { width:100%; }
  .bot h4 { font-size:16px; margin:6px 0 2px; color:var(--amber); }
  .bot code { font-family:"SF Mono", Menlo, monospace; font-size:14px; color:var(--cyan); }
  input, textarea { flex:1; background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:12px;
                    padding:12px 14px; font:inherit; outline:none; min-width:0; }
  input:focus, textarea:focus { border-color:var(--amber); }
  textarea { resize:none; height:52px; }
  button { background:var(--amber); color:#1d1406; border:0; border-radius:12px; padding:0 22px; font:inherit;
           font-weight:700; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
  #log { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; min-height:320px;
         max-height:60vh; overflow:auto; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .bot { white-space:normal; }
  .you { align-self:flex-end; background:#3a2d17; border:1px solid #6b5125; }
  .bot { align-self:flex-start; background:#221d31; border:1px solid var(--line); }
  .hint { color:var(--muted); font-size:14px; }
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  .stat b { display:block; font:700 22px/1.2 "SF Mono", Menlo, monospace; color:var(--cyan); }
  .stat.hot b { color:var(--amber); }
  .stat span { font-size:12px; color:var(--muted); }
  #status { font-size:14px; color:var(--soft); min-height:20px; }
  @media (max-width:600px) { .stats { grid-template-columns:repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <div>
    <h1>My First LLM</h1>
    <div class="sub">Qwen3-8B on one H100, served by vLLM on your own Modal account</div>
  </div>

  <div>
    <label for="url">Your server URL (printed by <code>modal serve serve.py</code>)</label>
    <input id="url" placeholder="https://your-workspace--my-first-llm-serve-dev.modal.run" spellcheck="false">
  </div>

  <div id="log"><p class="hint">Ask anything. The answer streams in token by token, and the numbers below show how
    fast your GPU is producing them.</p></div>

  <div class="stats">
    <div class="stat"><b id="n">0</b><span>tokens in this answer</span></div>
    <div class="stat hot"><b id="rate">-</b><span>tokens a second</span></div>
    <div class="stat"><b id="ms">-</b><span>milliseconds per token</span></div>
    <div class="stat"><b id="ttft">-</b><span>seconds to the first token</span></div>
  </div>

  <div class="row">
    <textarea id="q" placeholder="Explain to a curious student why a GPU is so good at running AI models."></textarea>
    <button id="send">Send</button>
  </div>
  <div id="status"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const history = [];
try { $("url").value = localStorage.getItem("myllm-url") || ""; } catch (e) {}
$("url").addEventListener("change", () => { try { localStorage.setItem("myllm-url", $("url").value.trim()); } catch (e) {} });
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("send").addEventListener("click", send);

function md(t) {            // just enough Markdown for chat answers: headings, bold, code, bullets
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.split("\n").map(l => {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    if (/^#{1,6}\s/.test(l)) return "<h4>" + l.replace(/^#{1,6}\s/, "") + "</h4>";
    if (/^\s*[-*]\s/.test(l)) return "&bull; " + l.replace(/^\s*[-*]\s/, "") + "<br>";
    return l ? l + "<br>" : "<br>";
  }).join("");
}

function bubble(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  return d;
}

async function send() {
  const base = $("url").value.trim().replace(/\/+$/, "");
  const q = $("q").value.trim() || $("q").placeholder;
  if (!base) { $("status").textContent = "Paste your server URL first."; return; }
  if ($("log").querySelector(".hint")) $("log").innerHTML = "";
  $("q").value = ""; $("send").disabled = true;
  bubble("you", q); history.push({ role: "user", content: q });
  const out = bubble("bot", "");
  ["n", "rate", "ms", "ttft"].forEach(k => $(k).textContent = k === "n" ? "0" : "-");
  const t0 = performance.now(); let first = null, last = null, n = 0, text = "";
  const slow = setTimeout(() => { if (first === null) $("status").textContent =
    "Waking your H100. The very first answer can take a few minutes while the model loads."; }, 3000);
  $("status").textContent = "Sending ...";
  try {
    const res = await fetch(base + "/v1/chat/completions", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "qwen3-8b", messages: history, max_tokens: 1024, temperature: 0.7, stream: true,
        stream_options: { include_usage: true }, chat_template_kwargs: { enable_thinking: false } }) });
    if (!res.ok) throw new Error("the server answered " + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ") || line.slice(6).trim() === "[DONE]") continue;
        let j; try { j = JSON.parse(line.slice(6)); } catch (e) { continue; }
        if (j.usage && j.usage.completion_tokens) n = j.usage.completion_tokens;
        const piece = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (!piece) continue;
        const now = performance.now();
        if (first === null) { first = now; $("ttft").textContent = ((now - t0) / 1000).toFixed(2); $("status").textContent = ""; }
        last = now; n += 1; text += piece; out.innerHTML = md(text);
        $("n").textContent = n; $("log").scrollTop = $("log").scrollHeight;
        if (n > 1) { const r = (n - 1) / ((last - first) / 1000); $("rate").textContent = r.toFixed(0); $("ms").textContent = (1000 / r).toFixed(1); }
      }
    }
    $("n").textContent = n;
    history.push({ role: "assistant", content: text });
    $("status").textContent = "Done. Each token needed about 15 billion operations and one trip of the weights across the road.";
  } catch (e) {
    out.textContent = "Could not reach your server (" + e.message + "). Is modal serve serve.py still running?";
    $("status").textContent = "";
  } finally { clearTimeout(slow); $("send").disabled = false; }
}
</script>
</body>
</html>
